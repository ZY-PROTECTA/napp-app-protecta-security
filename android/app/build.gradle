apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/* =========================================================
 *  React Native (Node config)
 * ========================================================= */
project.ext.react = [
    nodeExecutableAndArgs: [
        project.findProperty("NODE_BINARY")
    ]
]

/* =========================================================
 *  Utils
 * ========================================================= */

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

static def versionToNumber(major, minor, patch) {
    return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
    def version = providers.exec {
        workingDir(projectDir)
        commandLine(
            "/Users/jsaenz/.nvm/versions/node/v18.18.2/bin/node",
            "-e",
            "console.log(require('react-native/package.json').version)"
        )
    }.standardOutput.asText.get().trim()

    def core = version.split("-")[0]
    def (major, minor, patch) = core.tokenize('.').collect { it.toInteger() }

    return versionToNumber(major, minor, patch)
}

def rnVersion = getRNVersion()

/* =========================================================
 *  React Native / Expo
 * ========================================================= */

react {

    entryFile = file(
        [
            "/Users/jsaenz/.nvm/versions/node/v18.18.2/bin/node",
            "-e",
            "require('expo/scripts/resolveAppEntry')",
            projectRoot,
            "android",
            "absolute"
        ].execute(null, rootDir).text.trim()
    )

    reactNativeDir = new File(
        [
            "/Users/jsaenz/.nvm/versions/node/v18.18.2/bin/node",
            "--print",
            "require.resolve('react-native/package.json')"
        ].execute(null, rootDir).text.trim()
    ).getParentFile()

    codegenDir = new File(
        [
            "/Users/jsaenz/.nvm/versions/node/v18.18.2/bin/node",
            "--print",
            "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"
        ].execute(null, rootDir).text.trim()
    ).getParentFile()

    cliFile = new File(
        [
            "/Users/jsaenz/.nvm/versions/node/v18.18.2/bin/node",
            "--print",
            "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"
        ].execute(null, rootDir).text.trim()
    )

    bundleCommand = "export:embed"

    hermesCommand =
        reactNativeDir.asFile.get().absolutePath +
            "/sdks/hermesc/%OS-BIN%/hermesc"

    if (rnVersion >= versionToNumber(0, 75, 0)) {
        autolinkLibrariesWithApp()
    }
}

/* =========================================================
