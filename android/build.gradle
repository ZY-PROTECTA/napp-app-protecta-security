// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '34.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '34')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')

        kotlinVersion = findProperty('android.kotlinVersion') ?: '1.9.23'
        ndkVersion = "26.1.10909125"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // ✅ OBLIGATORIO poner versión
        classpath("com.android.tools.build:gradle:8.5.2")

        // ✅ Kotlin con versión
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")

        // ✅ SIN versión (RN lo gestiona internamente)
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {

        // React Native Android binaries
        maven {
            url(new File(
                ['node', '--print', "require.resolve('react-native/package.json')"]
                    .execute(null, rootDir)
                    .text
                    .trim(),
                '../android'
            ))
        }

        // JSC
        maven {
            url(new File(
                ['node', '--print',
                 "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"]
                    .execute(null, rootDir)
                    .text
                    .trim(),
                '../dist'
            ))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}
